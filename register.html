<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form">
            <h2>Register</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password (min 6 characters)">
            <button onclick="register()">Register</button>
            <div id="error" class="error-message"></div>
            <div class="auth-link">Already have an account? <a href="/login">Login</a></div>
        </div>
    </div>

    <script>
        async function register() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorElement = document.getElementById('error');
            
            if (!username || !password) {
                errorElement.textContent = 'Please fill in all fields';
                return;
            }
            
            if (password.length < 6) {
                errorElement.textContent = 'Password must be at least 6 characters';
                return;
            }
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                if (result.success) {
                    window.location.href = '/login';
                } else {
                    errorElement.textContent = result.error || 'Registration failed';
                }
            } catch (error) {
                errorElement.textContent = 'An error occurred';
                console.error('Registration error:', error);
            }
        }
        
        document.getElementById('password').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') register();
        });
    </script>
</body>
</html>
