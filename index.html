<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <h2>To-Do List</h2>
        <div class="user-info">
            <span id="usernameDisplay">User</span>
            <button onclick="logout()">Logout</button>
        </div>
        
        <table id="todoList">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Text</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="listBody">
                {{rows}}
            </tbody>
        </table>
        
        <div class="add-form">
            <input type="text" id="newItem" placeholder="Enter new item">
            <button onclick="addItem()">Add</button>
        </div>
    </div>

    <script>
        // Display username - improved version
        document.addEventListener('DOMContentLoaded', () => {
            const usernameElement = document.getElementById('usernameDisplay');
            
            fetch('/api/me')
                .then(res => {
                    if (!res.ok) throw new Error('Not authorized');
                    return res.json();
                })
                .then(data => {
                    usernameElement.textContent = `${data.username || 'User'}`;
                })
                .catch(() => {
                    usernameElement.textContent = 'User';
                });
        });

        // Add new item
        async function addItem() {
            const input = document.getElementById('newItem');
            const text = input.value.trim();
            
            if (text) {
                try {
                    const response = await fetch('/items', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text })
                    });
                    
                    if (response.ok) {
                        input.value = '';
                        window.location.reload();
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to add item');
                }
            }
        }
        
        // Delete item
        async function deleteItem(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                try {
                    await fetch(`/items/${id}`, { method: 'DELETE' });
                    window.location.reload();
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to delete item');
                }
            }
        }
        
        // Edit item
        let currentEditId = null;
        
        function startEdit(id) {
            if (currentEditId) return;
            
            const row = document.querySelector(`tr[data-id="${id}"]`);
            const textCell = row.querySelector('.item-text');
            const currentText = textCell.textContent;
            
            textCell.innerHTML = `
                <input type="text" id="edit-input-${id}" value="${currentText}">
                <button onclick="saveEdit(${id})">Save</button>
                <button onclick="cancelEdit(${id}, '${currentText.replace(/'/g, "\\'")}')">Cancel</button>
            `;
            
            currentEditId = id;
        }
        
        async function saveEdit(id) {
            const newText = document.getElementById(`edit-input-${id}`).value.trim();
            
            if (newText) {
                try {
                    await fetch(`/items/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: newText })
                    });
                    window.location.reload();
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to save changes');
                }
            }
        }
        
        function cancelEdit(id, originalText) {
            const row = document.querySelector(`tr[data-id="${id}"]`);
            const textCell = row.querySelector('td:nth-child(2)');
            textCell.innerHTML = originalText;
            currentEditId = null;
        }
        
        // Logout
        async function logout() {
            try {
                await fetch('/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (error) {
                console.error('Logout error:', error);
                alert('Failed to logout');
            }
        }
    </script>
</body>
</html>
