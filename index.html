<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th { background-color: #f0f0f0; }
        .add-form {
            margin: 20px auto;
            width: 70%;
            display: flex;
            gap: 10px;
        }
        .add-form input {
            flex-grow: 1;
            padding: 8px;
        }
        .add-form button { padding: 8px 15px; }
        .edit-form { display: none; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">To-Do List</h2>
    
    <table id="todoList">
        <thead>
            <tr>
                <th>#</th>
                <th>Text</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="listBody">
            {{rows}}
        </tbody>
    </table>
    
    <div class="add-form">
        <input type="text" id="newItem" placeholder="Enter new item">
        <button onclick="addItem()">Add</button>
    </div>

    <script>
        // Add new item
        async function addItem() {
            const input = document.getElementById('newItem');
            const text = input.value.trim();
            
            if (text) {
                try {
                    const response = await fetch('/items', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text })
                    });
                    
                    if (response.ok) {
                        input.value = '';
                        window.location.reload();
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }
        
        // Delete item
        async function deleteItem(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                try {
                    await fetch(`/items/${id}`, { method: 'DELETE' });
                    window.location.reload();
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }
        
        // Edit item
        let currentEditId = null;
        
        function startEdit(id) {
            const row = document.querySelector(`tr[data-id="${id}"]`);
            const textCell = row.querySelector('.item-text');
            const currentText = textCell.textContent;
            
            textCell.innerHTML = `
                <input type="text" id="edit-input-${id}" value="${currentText}">
                <button onclick="saveEdit(${id})">Save</button>
                <button onclick="cancelEdit(${id}, '${currentText}')">Cancel</button>
            `;
            
            currentEditId = id;
        }
        
        async function saveEdit(id) {
            const newText = document.getElementById(`edit-input-${id}`).value.trim();
            
            if (newText) {
                try {
                    await fetch(`/items/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: newText })
                    });
                    window.location.reload();
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }
        
        function cancelEdit(id, originalText) {
            const row = document.querySelector(`tr[data-id="${id}"]`);
            const textCell = row.querySelector('td:nth-child(2)');
            textCell.innerHTML = originalText;
            currentEditId = null;
        }
    </script>
</body>
</html>
